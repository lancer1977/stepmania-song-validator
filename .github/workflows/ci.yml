name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stepmania-song-validator-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Fork pull requests are intentionally skipped instead of running
    # untrusted code on a persistent runner or falling back to paid capacity.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, pr-validation, stepmania-song-validator]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify runner Python
        run: |
          /usr/bin/python3.11 -c 'import sys; assert sys.version_info[:2] == (3, 11), sys.version'
          /usr/bin/python3.11 -m venv "$RUNNER_TEMP/stepmania-song-validator-venv"
          echo "$RUNNER_TEMP/stepmania-song-validator-venv/bin" >> "$GITHUB_PATH"

      - name: Install build tooling
        run: python -m pip install ".[build]"

      - name: Run tests
        run: bash scripts/validate.sh
