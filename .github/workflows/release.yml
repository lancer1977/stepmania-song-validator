name: Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to validate and publish
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    # Only the reviewed workflow on protected main may publish.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.PYPI_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Independent of the `release` job on purpose: this job publishes to PyPI
    # using Trusted Publishing (OIDC), which requires a one-time manual setup
    # on pypi.org (Add trusted publisher) before it will authenticate
    # successfully. It runs in its own job (not a step in `release`) so that
    # failure never blocks or cascades into the GitHub release/tag creation
    # below.
    #
    # Gated on the PYPI_PUBLISHING_ENABLED repo variable so it no-ops (shows
    # as skipped, not failed) until PyPI-side setup is actually done. Flip it
    # on with: gh variable set PYPI_PUBLISHING_ENABLED --body true
    if: vars.PYPI_PUBLISHING_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}

      - name: Verify immutable release source
        run: |
          test "$SOURCE_SHA" =~ ^[0-9a-f]{40}$
          resolved_sha="$(git rev-parse --verify "${SOURCE_SHA}^{commit}")"
          test "$SOURCE_SHA" = "$resolved_sha"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install ".[build]"

      - name: Build release package
        run: python3 -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Build and publish package
    # Keep contents:write scoped to this trusted default-branch dispatch job.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}

      - name: Verify immutable release source
        run: |
          test "$SOURCE_SHA" =~ ^[0-9a-f]{40}$
          resolved_sha="$(git rev-parse --verify "${SOURCE_SHA}^{commit}")"
          test "$SOURCE_SHA" = "$resolved_sha"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install ".[build]"

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Resolve release version
        id: version
        run: |
          base_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${base_version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build release package
        run: python3 -m build

      - name: Checksum release package
        run: |
          cd dist
          sha256sum \
            "stepmania_song_validator-${{ steps.version.outputs.base_version }}-py3-none-any.whl" \
            "stepmania_song_validator-${{ steps.version.outputs.base_version }}.tar.gz" \
            > "stepmania_song_validator-${{ steps.version.outputs.base_version }}.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/stepmania_song_validator-${{ steps.version.outputs.base_version }}-py3-none-any.whl \
            dist/stepmania_song_validator-${{ steps.version.outputs.base_version }}.tar.gz \
            dist/stepmania_song_validator-${{ steps.version.outputs.base_version }}.sha256 \
            --title "stepmania-song-validator ${{ steps.version.outputs.tag }}" \
            --prerelease \
            --generate-notes \
            --target "$SOURCE_SHA"
